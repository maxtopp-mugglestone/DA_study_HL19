"root":
  setup_env_script: "none"
  # use_eos_for_large_files: true
  # eos_path: "root://eosuser.cern.ch//eos/user/c/cdroin/HTC"
  eos_python: "root://eosuser.cern.ch//eos/user/t/toppmugg/envs/DA19.tar.gz"
  generations:
    1: # Build the particle distribution and base collider
      job_folder: "../../template_jobs/1_build_distr_and_collider"
      job_executable: 1_build_distr_and_collider.py
      files_to_clone: # relative to the template job folder
        - 1_build_distr_and_collider.py
        - config.yaml
      files_to_copy_node: #relative to template job folder
        - 1_build_distr_and_collider.py
        - config.yaml
      files_to_return:
        - collider.json.zip
        - output_python.txt
        - error_python.txt
        - tree_maker.json
        - tree_maker.log
        - particles
        - config_gen1.yaml
      run_on: "htc" # "local_pc" 'htc_docker' #'htc' #'slurm' #'slurm_docker'
      context: "cpu" # 'cupy' # opencl # how to run the simulation
      # Following parameter is ignored when run_on is not htc or htc_docker
      htc_job_flavor: "espresso" # optional parameter to define job flavor, default is espresso
      # Following parameter is ignored when run_on is not htc_docker or slurm_docker
      singularity_image: "/cvmfs/unpacked.cern.ch/gitlab-registry.cern.ch/cdroin/da-study-docker:df9f2e53"
    2: # Launch the pymask and prepare the colliders
      job_folder: "../../template_jobs/2_configure_and_track"
      job_executable: 2_configure_and_track.py # has to be a python file
      files_to_clone:
        - gen_config_orbit_correction.py
      files_to_copy_node:
        - 2_configure_and_track.py
        - config.yaml
        - gen_config_orbit_correction.py
        - "/afs/cern.ch/work/t/toppmugg/private/DA_HL19/studies/filling_scheme"
        - "../config_gen1.yaml"
        - "../collider.json.zip"
        - "../particles"
      files_to_return:
        - output_particles.parquet
        - output_python.txt
        - error_python.txt
        - tree_maker.json
        - tree_maker.log
        - config_final.yaml
      context: "cpu" # 'cupy' # opencl # how to run the simulation
      run_on: "htc" # 'local_pc' # 'htc_docker' #'htc' #'slurm' #'slurm_docker'
      # Following parameter is ignored when run_on is not htc or htc_docker
      htc_job_flavor: "tomorrow" # optional parameter to define job flavor, default is espresso
      # Following parameter is ignored when run_on is not htc_docker or slurm_docker
      singularity_image: "/cvmfs/unpacked.cern.ch/gitlab-registry.cern.ch/cdroin/da-study-docker:df9f2e53"
